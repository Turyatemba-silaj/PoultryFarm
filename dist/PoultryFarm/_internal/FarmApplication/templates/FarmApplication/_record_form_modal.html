<div class="modal-header">
    <h2>{{ title }}</h2>
    <button class="modal-close" type="button" data-modal-close aria-label="Close">&times;</button>
</div>
<form class="modal-form" method="post" action="{{ action_url }}">
    {% csrf_token %}
    {% for field in form %}
        <div class="field">
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}<div class="errors">{{ field.errors }}</div>{% endif %}
        </div>
    {% endfor %}
    {% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors }}</div>{% endif %}
    <div class="actions">
        <button class="button" type="submit">Save</button>
        <button class="button secondary" type="button" data-modal-close>Cancel</button>
    </div>
</form>
